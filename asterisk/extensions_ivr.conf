; ===========================================================================
; extensions_ivr.conf - Self-service IVR with verified API lookups
;
; Include from extensions.conf:   #include extensions_ivr.conf
; Route your inbound DID to:      Goto(ivr-entry,s,1)
;
; Flow:
;   language -> main menu -> verify (case number + PIN + caller ID)
;   -> spoken result -> main menu / agent
;   Agent requests outside working hours -> callback request.
;
; Prompts live in sounds/<lang>/custom/ (see prompts/PROMPTS.md).
; All data access is done by agi/ivr_agi.py; the dialplan only plays prompts.
; ===========================================================================

[globals]
QUEUE_NAME=helpline
MAX_ATTEMPTS=3
MAX_MENU_TRIES=3
; Working hours for agents (Somalia: Saturday-Thursday)
OPEN_HOURS=08:00-17:00
OPEN_DAYS=sat-thu
TZ_IVR=Africa/Mogadishu


; ---------------------------------------------------------------------------
; Entry point and language selection
; ---------------------------------------------------------------------------
[ivr-entry]
exten => s,1,Answer()
 same => n,Set(TIMEOUT(digit)=5)
 same => n,Set(TIMEOUT(response)=8)
 same => n,Set(CHANNEL(language)=so)           ; Somali by default
 same => n,Set(MENU_TRIES=0)
 same => n,Playback(custom/welcome)
 same => n,Background(custom/select-language)  ; 1 Somali, 2 English
 same => n,WaitExten(5)

exten => 1,1,Set(CHANNEL(language)=so)
 same => n,Goto(ivr-main,s,1)

exten => 2,1,Set(CHANNEL(language)=en)
 same => n,Goto(ivr-main,s,1)

; No input or invalid input -> continue in Somali
exten => t,1,Goto(1,1)
exten => i,1,Goto(1,1)


; ---------------------------------------------------------------------------
; Main menu
; ---------------------------------------------------------------------------
[ivr-main]
exten => s,1,Set(MENU_TRIES=$[${MENU_TRIES} + 1])
 same => n,GotoIf($[${MENU_TRIES} > ${MAX_MENU_TRIES}]?ivr-agent-or-callback,s,1)
 same => n,Background(custom/main-menu)
 same => n,WaitExten(6)

exten => 1,1,Set(LOOKUP_FOR=reg)       ; Am I registered?
 same => n,Goto(ivr-verify,s,1)

exten => 2,1,Set(LOOKUP_FOR=dist)      ; When is the next distribution?
 same => n,Goto(ivr-verify,s,1)

exten => 3,1,Set(LOOKUP_FOR=case)      ; What is happening with my case?
 same => n,Goto(ivr-verify,s,1)

exten => 4,1,Goto(ivr-faq,s,1)          ; General information (no verification)

exten => 0,1,Goto(ivr-agent-or-callback,s,1)

exten => i,1,Playback(custom/invalid-option)
 same => n,Goto(s,1)

exten => t,1,Goto(s,1)


; ---------------------------------------------------------------------------
; Verification + lookup. Nothing personal is spoken before this succeeds.
; ---------------------------------------------------------------------------
[ivr-verify]
exten => s,1,Set(ATTEMPTS=0)
 same => n(ask),Set(ATTEMPTS=$[${ATTEMPTS} + 1])
 same => n,Read(CASE_ID,custom/enter-case-number,10,,1,10)
 same => n,Read(PIN,custom/enter-pin,4,,1,10)
 same => n,Set(LOOKUP_RESULT=)
 same => n,AGI(ivr_agi.py,lookup,${CASE_ID},${PIN})
 same => n,Set(PIN=)                            ; do not keep the PIN on the channel
 same => n,GotoIf($["${LOOKUP_RESULT}" = "OK"]?ok)
 same => n,GotoIf($["${LOOKUP_RESULT}" = "ERROR"]?error)
 same => n,GotoIf($["${LOOKUP_RESULT}" = ""]?error)
 same => n,Playback(custom/verify-failed)
 same => n,GotoIf($[${ATTEMPTS} < ${MAX_ATTEMPTS}]?ask)
 same => n,Playback(custom/too-many-attempts)
 same => n,Goto(ivr-agent-or-callback,s,1)
 same => n(error),Playback(custom/system-unavailable)
 same => n,Goto(ivr-agent-or-callback,s,1)
 same => n(ok),Goto(ivr-result-${LOOKUP_FOR},s,1)


; ---------------------------------------------------------------------------
; Results
; ---------------------------------------------------------------------------
[ivr-result-reg]
; REG_STATUS: REGISTERED | PENDING | NOT_REGISTERED
exten => s,1,Playback(custom/reg-${TOLOWER(${REG_STATUS})})
 same => n,Goto(ivr-after-answer,s,1)

[ivr-result-dist]
exten => s,1,GotoIf($["${NEXT_DIST_DATE}" = ""]?none)
 same => n,Playback(custom/dist-next-date)
 same => n,Gosub(sub-say-date,s,1(${NEXT_DIST_DATE}))
 same => n,Goto(ivr-after-answer,s,1)
 same => n(none),Playback(custom/dist-none)
 same => n,Goto(ivr-after-answer,s,1)

[ivr-result-case]
; CASE_STATUS: RECEIVED | IN_PROGRESS | RESOLVED | NONE
exten => s,1,Playback(custom/case-${TOLOWER(${CASE_STATUS})})
 same => n,Goto(ivr-after-answer,s,1)

[ivr-after-answer]
exten => s,1,Set(MENU_TRIES=0)
 same => n,Background(custom/after-answer)   ; 1 main menu, 0 agent, or hang up
 same => n,WaitExten(6)
exten => 1,1,Goto(ivr-main,s,1)
exten => 0,1,Goto(ivr-agent-or-callback,s,1)
exten => t,1,Playback(custom/goodbye)
 same => n,Hangup()
exten => i,1,Goto(s,1)


; ---------------------------------------------------------------------------
; Speak a date YYYYMMDD using recorded prompts (works for any language,
; including Somali where Asterisk has no built-in date grammar).
; Needs digits in sounds/<lang>/digits/ and custom/month-01..12.
; ---------------------------------------------------------------------------
[sub-say-date]
exten => s,1,SayNumber($[${ARG1:6:2} + 0])
 same => n,Playback(custom/month-${ARG1:4:2})
 same => n,Return()


; ---------------------------------------------------------------------------
; General information. Prompts are recorded per topic and can be replaced
; by staff without changing the dialplan.
; ---------------------------------------------------------------------------
[ivr-faq]
exten => s,1,Background(custom/faq-menu)
 same => n,WaitExten(6)
exten => _[1-5],1,Playback(custom/faq-${EXTEN})
 same => n,Goto(ivr-after-answer,s,1)
exten => 0,1,Goto(ivr-agent-or-callback,s,1)
exten => 9,1,Goto(ivr-main,s,1)
exten => i,1,Playback(custom/invalid-option)
 same => n,Goto(s,1)
exten => t,1,Goto(ivr-main,s,1)


; ---------------------------------------------------------------------------
; Agent or callback, depending on working hours
; ---------------------------------------------------------------------------
[ivr-agent-or-callback]
exten => s,1,GotoIfTime(${OPEN_HOURS},${OPEN_DAYS},*,*,${TZ_IVR}?ivr-agent,s,1)
 same => n,Goto(ivr-afterhours,s,1)

[ivr-agent]
exten => s,1,Playback(custom/transferring)
 same => n,Queue(${QUEUE_NAME},t,,,180)
 ; Queue timed out or no agents logged in -> offer a callback
 same => n,Goto(ivr-callback,s,1)

[ivr-afterhours]
exten => s,1,Playback(custom/after-hours)
 same => n,Goto(ivr-callback,s,1)

[ivr-callback]
exten => s,1,Background(custom/offer-callback)  ; 1 request a callback
 same => n,WaitExten(6)
exten => 1,1,AGI(ivr_agi.py,callback,${CASE_ID})
 same => n,GotoIf($["${CALLBACK_RESULT}" = "OK"]?ok)
 same => n,Playback(custom/system-unavailable)
 same => n,Hangup()
 same => n(ok),Playback(custom/callback-confirmed)
 same => n,Playback(custom/goodbye)
 same => n,Hangup()
exten => t,1,Playback(custom/goodbye)
 same => n,Hangup()
exten => i,1,Goto(s,1)
